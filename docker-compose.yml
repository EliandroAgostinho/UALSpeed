version: '3.8'

services:

  # ─── SERVIÇOS DA APLICAÇÃO ───────────────────────────────

  data-processor:
    build: ./services/data-processor
    image: ualspped-data-processor:latest
    # SEM container_name — o Docker gera automaticamente
    # SEM ports — o Nginx faz o proxy internamente
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - ualspped-network
    restart: unless-stopped
    deploy:
      replicas: 2

  results-manager:
    build: ./services/results-manager
    image: ualspped-results-manager:latest
    # SEM container_name
    # SEM ports
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_started
      mongo-primary:
        condition: service_healthy
      mongo-secondary1:
        condition: service_healthy
      mongo-secondary2:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URL=mongodb://mongo-primary:27017,mongo-secondary1:27017,mongo-secondary2:27017/?replicaSet=ualspped-rs
    networks:
      - ualspped-network
    restart: on-failure

  # ─── REDIS ───────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: ualspped-redis
    ports:
      - "6379:6379"
    networks:
      - ualspped-network
    restart: unless-stopped

  # ─── MONGODB REPLICA SET ─────────────────────────────────

  mongo-primary:
    image: mongo:7
    container_name: ualspped-mongo-primary
    command: mongod --replSet ualspped-rs --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo_primary_data:/data/db
    networks:
      - ualspped-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      #start_period: 30s

  mongo-secondary1:
    image: mongo:7
    container_name: ualspped-mongo-secondary1
    command: mongod --replSet ualspped-rs --bind_ip_all
    ports:
      - "27018:27017"
    volumes:
      - mongo_secondary1_data:/data/db
    networks:
      - ualspped-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      #start_period: 30s

  mongo-secondary2:
    image: mongo:7
    container_name: ualspped-mongo-secondary2
    command: mongod --replSet ualspped-rs --bind_ip_all
    ports:
      - "27019:27017"
    volumes:
      - mongo_secondary2_data:/data/db
    networks:
      - ualspped-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      #start_period: 30s

  # Inicializa o Replica Set automaticamente
  mongo-init:
    image: mongo:7
    container_name: ualspped-mongo-init
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary1:
        condition: service_healthy
      mongo-secondary2:
        condition: service_healthy
    #volumes:
     # - ./infra/mongo/init-replica.js:/docker-entrypoint-initdb.d/init-replica.js   #./infra/mongo/init-replica.js:/init-replica.js
     # - ./infra/mongo/init-replica.sh:/init-replica.sh #./infra/mongo/wait-and-init.sh:/wait-and-init.sh
    entrypoint: >
      bash -c "
        echo '⏳ Aguardando MongoDB primario...' &&
        until mongosh --host mongo-primary:27017 --eval 'db.adminCommand({ping: 1})' --quiet; do
          echo 'MongoDB ainda nao responde, aguardando 3s...'
          sleep 3
        done &&
        echo '✅ MongoDB disponivel!' &&
        mongosh --host mongo-primary:27017 --eval '
          var maxTentativas = 10;
          var tentativa = 0;
          var iniciado = false;
          while (tentativa < maxTentativas && !iniciado) {
            try {
              var status = rs.status();
              if (status.ok === 1) {
                print(\"Replica Set ja configurado:\", status.set);
                iniciado = true;
              }
            } catch(e) {
              try {
                rs.initiate({
                  _id: \"ualspped-rs\",
                  members: [
                    { _id: 0, host: \"mongo-primary:27017\", priority: 2 },
                    { _id: 1, host: \"mongo-secondary1:27017\", priority: 1 },
                    { _id: 2, host: \"mongo-secondary2:27017\", priority: 1 }
                  ]
                });
                print(\"✅ Replica Set iniciado com sucesso!\");
                iniciado = true;
              } catch(e2) {
                print(\"Tentativa\", tentativa, \"falhou:\", e2.message);
                sleep(3000);
                tentativa++;
              }
            }
          }
          if (!iniciado) { quit(1); }
        ' &&
        echo '⏳ Aguardando eleicao do Primary (15s)...' &&
        sleep 15 &&
        echo '✅ Verificando estado final:' &&
        mongosh --host mongo-primary:27017 --eval 'rs.status().members.forEach(m => print(m.name, m.stateStr))'
      "   
    #["/bin/bash", "/init-replica.sh"] #command: bash /wait-and-init.sh
    networks:
      - ualspped-network

  # ─── Servidor nginx ─────────────────────────────────    
  nginx:
    image: nginx:alpine
    container_name: ualspped-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - data-processor
      - results-manager
    networks:
      - ualspped-network
    restart: unless-stopped   

  web-interface:
    build: ./services/web-interface
    image: ualspped-web-interface:latest
    container_name: ualspped-web-interface
    ports:
      - "8002:8002"
    environment:
      - DATA_PROCESSOR_URL=http://data-processor:8000
      - RESULTS_MANAGER_URL=http://results-manager:8001
    depends_on:
      - data-processor
      - results-manager
    networks:
      - ualspped-network
    restart: unless-stopped   

networks:
  ualspped-network:
    driver: bridge

volumes:
  mongo_primary_data:
  mongo_secondary1_data:
  mongo_secondary2_data: