version: '3.8'

services:

  data-processor:
    build: ./services/data-processor
    container_name: ualspped-data-processor
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - ualspped-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ualspped-redis
    ports:
      - "6379:6379"
    networks:
      - ualspped-network
    restart: unless-stopped

networks:
  ualspped-network:
    driver: bridge