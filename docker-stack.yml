version: '3.8'

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf  
    #volumes:
    #  - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    #depends_on:
    #  - data-processor
    #  - results-manager
    networks:
      - ualspped-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  data-processor:
    image: ualspped-data-processor:latest
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - ualspped-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s

  results-manager:
    image: ualspped-results-manager:latest
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URL=mongodb://mongo-primary:27017,mongo-secondary1:27017,mongo-secondary2:27017/?replicaSet=ualspped-rs
    networks:
      - ualspped-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s

  redis:
    image: redis:7-alpine
    networks:
      - ualspped-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  mongo-primary:
    image: mongo:7
    command: mongod --replSet ualspped-rs --bind_ip_all
    volumes:
      - mongo_primary_data:/data/db
    networks:
      - ualspped-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  mongo-secondary1:
    image: mongo:7
    command: mongod --replSet ualspped-rs --bind_ip_all
    volumes:
      - mongo_secondary1_data:/data/db
    networks:
      - ualspped-network
    deploy:
      replicas: 1

  mongo-secondary2:
    image: mongo:7
    command: mongod --replSet ualspped-rs --bind_ip_all
    volumes:
      - mongo_secondary2_data:/data/db
    networks:
      - ualspped-network
    deploy:
      replicas: 1

  web-interface:
    image: ualspped-web-interface:latest
    environment:
      - DATA_PROCESSOR_URL=http://data-processor:8000
      - RESULTS_MANAGER_URL=http://results-manager:8001
    networks:
      - ualspped-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure      

networks:
  ualspped-network:
    driver: overlay

volumes:
  mongo_primary_data:
  mongo_secondary1_data:
  mongo_secondary2_data:

configs:
  nginx_config:
    file: ./infra/nginx/nginx.conf